[package]
name = "lumaglyph"
version = "0.4.4"
edition = "2021"
rust-version = "1.75"
description = "High-throughput 95-character color ASCII art and streaming video workstation"
license = "MIT"
readme = "README.md"
repository = "https://github.com/goldggs/lumaglyph"
keywords = ["ascii", "ascii-art", "video", "terminal", "graphics"]
categories = ["multimedia::images", "multimedia::video", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
eframe = { version = "0.31", default-features = false, features = [
    "glow",
    "x11",
    "wayland",
] }
egui = "0.31"
flate2 = "1.0"
fontdue = "0.9"
gif = "0.13"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
] }
rayon = "1.10"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
