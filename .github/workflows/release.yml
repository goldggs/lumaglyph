name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Release (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: lumaglyph-linux-x86_64
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: lumaglyph-macos-arm64
            archive: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: lumaglyph-macos-x86_64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lumaglyph-windows-x86_64
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build hardened binary, audit zero path leaks & package archive
        shell: python
        env:
          LUMAGLYPH_GITHUB_REPO: ${{ github.repository }}
          TARGET_TRIPLE: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
          ARCHIVE_KIND: ${{ matrix.archive }}
        run: |
          import hashlib, os, pathlib, stat, subprocess, sys, tarfile, zipfile

          target = os.environ["TARGET_TRIPLE"]
          artifact = os.environ["ARTIFACT_NAME"]
          archive_kind = os.environ["ARCHIVE_KIND"]

          home = pathlib.Path.home()
          workspace = os.environ.get("GITHUB_WORKSPACE", str(pathlib.Path.cwd()))
          cargo_home = os.environ.get("CARGO_HOME", str(home / ".cargo"))
          rustup_home = os.environ.get("RUSTUP_HOME", str(home / ".rustup"))

          flags = [
              "-C", "force-frame-pointers=no",
              f"--remap-path-prefix={workspace}=/src",
              f"--remap-path-prefix={cargo_home}=/cargo",
              f"--remap-path-prefix={rustup_home}=/rustup",
              f"--remap-path-prefix={home}=/home",
          ]
          if os.name == "nt":
              flags.extend(["-C", "link-arg=/DEBUG:NONE"])

          env = os.environ.copy()
          env["RUSTFLAGS"] = " ".join(flags)

          subprocess.run(
              ["cargo", "build", "--release", "--locked", "--target", target],
              env=env,
              check=True,
          )

          bin_name = "lumaglyph.exe" if os.name == "nt" else "lumaglyph"
          exe = pathlib.Path("target") / target / "release" / bin_name
          data = exe.read_bytes()

          forbidden = [
              b"/home/runner",
              b"/Users/runner",
              b"runneradmin",
              b"C:\\Users\\",
              b"D:\\a\\",
              workspace.encode("utf-8"),
          ]
          leaks = [pat.decode("utf-8", "ignore") for pat in forbidden if pat and pat in data]
          if leaks:
              print(f"FATAL: Leaked build paths detected: {leaks}", file=sys.stderr)
              sys.exit(1)
          print(f"Verified clean binary: {exe} ({len(data)/(1024*1024):.2f} MB)")

          if os.name != "nt":
              exe.chmod(exe.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

          if archive_kind == "zip":
              out_archive = pathlib.Path(f"{artifact}.zip")
              with zipfile.ZipFile(out_archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                  zf.write(exe, arcname=bin_name)
                  zf.write("LICENSE", arcname="LICENSE")
                  zf.write("README.md", arcname="README.md")
          else:
              out_archive = pathlib.Path(f"{artifact}.tar.gz")
              with tarfile.open(out_archive, "w:gz") as tf:
                  tf.add(exe, arcname=bin_name)
                  tf.add("LICENSE", arcname="LICENSE")
                  tf.add("README.md", arcname="README.md")

          digest = hashlib.sha256(out_archive.read_bytes()).hexdigest()
          pathlib.Path(f"{out_archive.name}.sha256").write_text(
              f"{digest}  {out_archive.name}\n", encoding="utf-8"
          )
          print(f"Packaged {out_archive} (sha256={digest})")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Consolidate SHA256SUMS.txt
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
