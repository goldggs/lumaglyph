name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Release (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            spec: "x86_64-unknown-linux-gnu:lumaglyph-linux-x86_64:tar.gz"
          - label: macos-universal-targets
            os: macos-latest
            rust_targets: aarch64-apple-darwin, x86_64-apple-darwin
            spec: "aarch64-apple-darwin:lumaglyph-macos-arm64:tar.gz;x86_64-apple-darwin:lumaglyph-macos-x86_64:tar.gz"
          - label: windows-x86_64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            spec: "x86_64-pc-windows-msvc:lumaglyph-windows-x86_64:zip"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Build hardened binaries, audit zero path leaks & package archives
        shell: python
        env:
          LUMAGLYPH_GITHUB_REPO: ${{ github.repository }}
          BUILD_SPEC: ${{ matrix.spec }}
        run: |
          import hashlib, os, pathlib, stat, subprocess, sys, tarfile, zipfile

          home = pathlib.Path.home()
          workspace = os.environ.get("GITHUB_WORKSPACE", str(pathlib.Path.cwd()))
          cargo_home = os.environ.get("CARGO_HOME", str(home / ".cargo"))
          rustup_home = os.environ.get("RUSTUP_HOME", str(home / ".rustup"))

          flags = [
              "-C", "force-frame-pointers=no",
              f"--remap-path-prefix={workspace}=/src",
              f"--remap-path-prefix={cargo_home}=/cargo",
              f"--remap-path-prefix={rustup_home}=/rustup",
              f"--remap-path-prefix={home}=/home",
          ]
          if os.name == "nt":
              flags.extend(["-C", "link-arg=/DEBUG:NONE"])

          env = os.environ.copy()
          env["RUSTFLAGS"] = " ".join(flags)

          out_dir = pathlib.Path("dist_pkg")
          out_dir.mkdir(exist_ok=True)

          for entry in os.environ["BUILD_SPEC"].split(";"):
              target, artifact, archive_kind = entry.strip().split(":")
              subprocess.run(
                  ["cargo", "build", "--release", "--locked", "--target", target],
                  env=env,
                  check=True,
              )

              bin_name = "lumaglyph.exe" if os.name == "nt" else "lumaglyph"
              exe = pathlib.Path("target") / target / "release" / bin_name
              data = exe.read_bytes()
              if os.name == "nt":
                  import struct
                  assert data[:2] == b"MZ", "Missing MZ header"
                  pe_off = struct.unpack_from("<I", data, 0x3C)[0]
                  assert data[pe_off:pe_off+4] == b"PE\x00\x00", "Missing PE signature"
                  subsystem = struct.unpack_from("<H", data, pe_off + 24 + 68)[0]
                  if subsystem != 2:
                      print(f"FATAL: Expected IMAGE_SUBSYSTEM_WINDOWS_GUI (2), got {subsystem}", file=sys.stderr)
                      sys.exit(1)
                  print("Verified Windows PE subsystem = IMAGE_SUBSYSTEM_WINDOWS_GUI (2) — single GUI app, no terminal.")

              forbidden = [
                  b"/home/runner",
                  b"/Users/runner",
                  b"runneradmin",
                  b"C:\\Users\\",
                  b"D:\\a\\",
                  workspace.encode("utf-8"),
              ]
              leaks = [pat.decode("utf-8", "ignore") for pat in forbidden if pat and pat in data]
              if leaks:
                  print(f"FATAL: Leaked build paths detected in {target}: {leaks}", file=sys.stderr)
                  sys.exit(1)
              print(f"Verified clean binary: {exe} ({len(data)/(1024*1024):.2f} MB)")

              if os.name != "nt":
                  exe.chmod(exe.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

              if archive_kind == "zip":
                  out_archive = out_dir / f"{artifact}.zip"
                  with zipfile.ZipFile(out_archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                      zf.write(exe, arcname=bin_name)
                      zf.write("LICENSE", arcname="LICENSE")
                      zf.write("README.md", arcname="README.md")
              else:
                  out_archive = out_dir / f"{artifact}.tar.gz"
                  with tarfile.open(out_archive, "w:gz") as tf:
                      tf.add(exe, arcname=bin_name)
                      tf.add("LICENSE", arcname="LICENSE")
                      tf.add("README.md", arcname="README.md")

              digest = hashlib.sha256(out_archive.read_bytes()).hexdigest()
              (out_dir / f"{out_archive.name}.sha256").write_text(
                  f"{digest}  {out_archive.name}\n", encoding="utf-8"
              )
              print(f"Packaged {out_archive} (sha256={digest})")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.label }}
          path: dist_pkg/*

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Consolidate SHA256SUMS.txt
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
